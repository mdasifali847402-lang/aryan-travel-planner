<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Trip - Travel Planner</title>

    <style>
        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            display: flex;
            min-height: 100vh;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            background: linear-gradient(160deg,
                    #073a31 0%,
                    #052c27 75%,
                    #062720 100%);

            color: #fff;
            min-height: 100vh;
            padding: 28px 17px 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .brand {
            text-align: center;
            padding: 0 4px 34px;
        }

        .brand-mark {
            width: 62px;
            height: 46px;
            margin: 0 auto 4px;
        }

        .brand-mark svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #e6fff4;
            stroke-width: 3.2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .brand h1 {
            font-size: 21px;
            letter-spacing: -0.8px;
            margin: 0;
            font-weight: 750;
        }

        .brand p {
            color: #c0d6ce;
            font-size: 10px;
            margin: 8px 0 0;
            letter-spacing: 0.25px;
        }

        .nav-menu {
            display: grid;
            gap: 8px;
        }

        .nav-link {
            color: #e4f1eb;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 160ms ease, transform 160ms ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(2px);
        }

        .nav-link.active {
            background: #147c63;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .nav-icon {
            width: 19px;
            text-align: center;
            font-size: 20px;
            line-height: 1;
        }

        .nav-icon.plus {
            font-size: 23px;
        }

        .sidebar-note {
            margin-top: auto;
            padding: 30px 20px 10px;
            color: #c4e3d5;
            position: relative;
        }

        .mini-mountain {
            font-size: 30px;
            letter-spacing: -8px;
            opacity: .8;
            transform: rotate(-7deg);
            margin-bottom: 5px;
        }

        .sidebar-note p {
            font-size: 17px;
            line-height: 1.28;
            font-style: italic;
            margin: 0;
            letter-spacing: -.3px;
        }

        .doodle-arrow {
            position: absolute;
            right: 14px;
            bottom: 12px;
            font-size: 30px;
            transform: rotate(-14deg);
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            flex: 1;

            padding: 35px 45px;
        }


        /* =========================
           HEADER
        ========================= */

        .top-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 35px;
        }


        .top-header h1 {
            font-size: 30px;

            margin-bottom: 7px;
        }


        .top-header p {
            color: #777;
        }


        /* =========================
           PROFILE ICON
        ========================= */

        .profile-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #003f35;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-weight: bold;
        }


        /* =========================
           CREATE TRIP CONTAINER
        ========================= */

        .create-trip-container {
            background: white;

            max-width: 900px;

            margin: auto;

            padding: 35px;

            border-radius: 14px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }


        /* =========================
           FORM HEADER
        ========================= */

        .form-header {
            margin-bottom: 30px;
        }


        .form-header h2 {
            font-size: 23px;

            margin-bottom: 6px;
        }


        .form-header p {
            color: #777;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 22px;
        }


        .form-group label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        input,
        select,
        textarea {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        input:focus,
        select:focus,
        textarea:focus {
            border-color: #15916f;
        }


        textarea {
            resize: vertical;
        }


        /* =========================
           TWO COLUMNS
        ========================= */

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .form-buttons {
            display: flex;

            justify-content: flex-end;

            gap: 15px;

            margin-top: 30px;
        }


        .cancel-btn,
        .create-btn {
            padding: 12px 25px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }


        .cancel-btn {
            background: white;

            border: 1px solid #ddd;

            color: #555;
        }


        .create-btn {
            background: #15916f;

            border: none;

            color: white;
        }


        .create-btn:hover {
            background: #117c60;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .sidebar {
                width: 220px;
            }

            .main-content {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .create-trip-container {
                padding: 25px;
            }

        }
    </style>
</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark" aria-hidden="true">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 80 54">
                        <path d="M8 43 25 22l9 10L49 9l23 34H8Z" />
                        <path d="m25 22 5-7 6 8M49 9l-5 8 8 1" />
                    </svg>
                </div>
            </div>

            <div>
                <h1>Trip Planner</h1>
                <p>Plan · Explore · Remember</p>
            </div>

        </div>



        <!-- NAVIGATION -->

        <nav class="nav-menu" aria-label="Main navigation">


            <!-- HOME -->

            <a class="nav-link" href="dashboard.html">
                <span class="nav-icon">⌂</span>
                Home
            </a>




            <a class="nav-link" href="/my-trips.html">
                <span class="nav-icon">▣</span>
                My Trips
            </a>



            <!-- CREATE TRIP -->

            <a class="nav-link active" href="/create-trip.html">
                <span class="nav-icon plus">＋</span>
                Create Trip
            </a>
            <!-- PROFILE -->
            <a class="nav-link" href="profile.html"><span class="nav-icon">♙</span>Profile</a>


        </nav>
        <div class="sidebar-note">
            <div class="mini-mountain">⌁⌁⌁</div>
            <p>Better<br> Bigger<br> Adventures</p>
            <span class="doodle-arrow">↗</span>
        </div>

    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main-content">


        <!-- HEADER -->

        <header class="top-header">

            <div>

                <h1>
                    Create New Trip
                </h1>

                <p>
                    Plan your next journey with ease.
                </p>

            </div>


            <div class="profile-section">

                <div class="profile-icon">
                    A
                </div>

            </div>

        </header>



        <!-- =========================
             CREATE TRIP FORM
        ========================= -->

        <section class="create-trip-container">


            <div class="form-header">

                <h2>
                    Trip Details
                </h2>

                <p>
                    Enter the details of your trip below.
                </p>

            </div>



            <form id="tripForm">


                <!-- TRIP NAME -->

                <div class="form-group">

                    <label for="tripName">
                        Trip Name
                    </label>

                    <input type="text" id="tripName" placeholder="Enter your trip name" required>

                </div>



                <!-- DESTINATION -->

                <div class="form-group">

                    <label for="destination">
                        Destination
                    </label>

                    <select id="destination" required>
                        <option value="">Select your destination</option>

                        <option value="Manali">Manali</option>
                        <option value="Goa">Goa</option>
                        <option value="Jaipur">Jaipur</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Shimla">Shimla</option>
                        <option value="Kasauli">Kasauli</option>
                        <option value="Agra">Agra</option>
                        <option value="Varanasi">Varanasi</option>
                        <option value="Udaipur">Udaipur</option>
                        <option value="Hampī">Hampī</option>
                        <option value="Rishikesh">Rishikesh</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Darjeeling">Darjeeling</option>
                    </select>
                </div>



                <!-- DATES -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="startDate">
                            Start Date
                        </label>

                        <input type="date" id="startDate" required>

                    </div>


                    <div class="form-group">

                        <label for="endDate">
                            End Date
                        </label>

                        <input type="date" id="endDate" required>

                    </div>

                </div>



                <!-- TRAVELLERS + TYPE -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="travellers">
                            Number of Travellers
                        </label>

                        <input type="number" id="travellers" min="1" placeholder="e.g. 2" required>

                    </div>


                    <div class="form-group">

                        <label for="tripType">
                            Trip Type
                        </label>

                        <select id="tripType" required>

                            <option value="">
                                Select trip type
                            </option>

                            <option value="Solo">
                                Solo
                            </option>

                            <option value="Friends">
                                Friends
                            </option>

                            <option value="Family">
                                Family
                            </option>

                            <option value="Couple">
                                Couple
                            </option>

                        </select>

                    </div>

                </div>



                <!-- BUDGET -->

                <div class="form-group">

                    <label for="budget">
                        Estimated Budget (₹)
                    </label>

                    <input type="number" id="budget" min="0" placeholder="Enter your estimated budget" required>

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Trip Description
                    </label>

                    <textarea id="description" rows="5" placeholder="Write something about your trip..."></textarea>

                </div>



                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button type="button" class="cancel-btn" onclick="history.back()">
                        Cancel
                    </button>


                    <button type="submit" class="create-btn">
                        Create Trip
                    </button>

                </div>

            </form>

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>
        // URL se data lena
        const urlParams = new URLSearchParams(window.location.search);
        const selectedDestination = urlParams.get("destination");
        const editTripId = urlParams.get("editTripId");

        const TRIPS_STORAGE_KEY = "aryanTravelTrips";

        const tripForm = document.getElementById("tripForm");

        const tripName = document.getElementById("tripName");
        const destination = document.getElementById("destination");
        const startDate = document.getElementById("startDate");
        const endDate = document.getElementById("endDate");
        const travellers = document.getElementById("travellers");
        const tripType = document.getElementById("tripType");
        const budget = document.getElementById("budget");
        const description = document.getElementById("description");


        // Local Storage se trips lena
        function getSavedTrips() {
            return JSON.parse(
                localStorage.getItem(TRIPS_STORAGE_KEY) || "[]"
            );
        }


        // EDIT MODE: Purani trip ka data form mein load karna
        let existingTrip = null;

        if (editTripId) {

            const savedTrips = getSavedTrips();

            existingTrip = savedTrips.find(
                trip => String(trip.id) === String(editTripId)
            );

            if (existingTrip) {

                tripName.value = existingTrip.tripName || "";
                destination.value = existingTrip.destination || "";
                startDate.value = existingTrip.startDate || "";
                endDate.value = existingTrip.endDate || "";
                travellers.value = existingTrip.travellers || "";
                tripType.value = existingTrip.tripType || "";
                budget.value = existingTrip.budget || "";
                description.value = existingTrip.description || "";

                // Heading change
                document.querySelector(".top-header h1").textContent = "Edit Trip";

                document.querySelector(".form-buttons .create-btn").textContent =
                    "Save Changes";

            } else {

                alert("Trip not found!");
                window.location.href = "my-trips.html";
            }

        } else if (selectedDestination) {

            destination.value = selectedDestination;
        }


        // Trip type ke according travellers set karna
        tripType.addEventListener("change", function () {

            if (this.value === "Solo") {
                travellers.value = 1;
            }
            else if (this.value === "Couple") {
                travellers.value = 2;
            }
            else {
                travellers.value = "";
            }

        });


        // FORM SUBMIT
        tripForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const start = startDate.value;
            const end = endDate.value;

            if (new Date(end + "T00:00:00") < new Date(start + "T00:00:00")) {
                alert("End date cannot be earlier than start date.");
                return;
            }

            const savedTrips = getSavedTrips();

            const imageMap = JSON.parse(
                localStorage.getItem("aryanDestinationImages") || "{}"
            );

            const selectedImage =
                imageMap[destination.value.toLowerCase()] || "";

            if (editTripId) {

                // EXISTING TRIP UPDATE KARNA
                const tripIndex = savedTrips.findIndex(
                    trip => String(trip.id) === String(editTripId)
                );

                if (tripIndex === -1) {
                    alert("Trip not found!");
                    return;
                }

                const oldTrip = savedTrips[tripIndex];

                savedTrips[tripIndex] = {
                    ...oldTrip,

                    tripName: tripName.value.trim(),
                    destination: destination.value,

                    destinationImage:
                        destination.value === oldTrip.destination
                            ? oldTrip.destinationImage
                            : selectedImage,

                    startDate: start,
                    endDate: end,
                    travellers: Number(travellers.value),
                    tripType: tripType.value,
                    budget: Number(budget.value),
                    description: description.value.trim(),

                    updatedAt: new Date().toISOString()
                };

                localStorage.setItem(
                    TRIPS_STORAGE_KEY,
                    JSON.stringify(savedTrips)
                );

                alert("Trip updated successfully!");

            } else {

                // NEW TRIP CREATE KARNA
                const newTrip = {
                    id: Date.now().toString(),
                    tripName: tripName.value.trim(),
                    destination: destination.value,
                    destinationImage: selectedImage,
                    startDate: start,
                    endDate: end,
                    travellers: Number(travellers.value),
                    tripType: tripType.value,
                    budget: Number(budget.value),
                    description: description.value.trim(),
                    createdAt: new Date().toISOString()
                };

                savedTrips.push(newTrip);

                localStorage.setItem(
                    TRIPS_STORAGE_KEY,
                    JSON.stringify(savedTrips)
                );

                alert("Trip created successfully!");
            }

            window.location.href = "my-trips.html";

        });

    </script>

</body>

</html>
