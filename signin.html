<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Aryan's Travel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f7fc;
            padding: 25px;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: flex;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
        }

        /* LEFT SECTION */

        .left-section {
            width: 50%;
            background:
                linear-gradient(rgba(0, 30, 65, 0.35), rgba(0, 30, 65, 0.65)),
                url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200') center/cover;
            color: white;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #61c5ff;
        }

        .travel-text h1 {
            font-size: 38px;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .travel-text p {
            font-size: 15px;
            line-height: 1.7;
            color: #e5efff;
        }

        /* RIGHT SECTION */

        .right-section {
            width: 50%;
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .theme-btn {
            position: absolute;
            top: 22px;
            right: 25px;
            border: none;
            background: #edf4ff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .heading h2 {
            font-size: 30px;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .heading p {
            color: #8492a6;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #344563;
            margin-bottom: 9px;
        }

        .input-group input {
            width: 100%;
            height: 49px;
            padding: 0 15px;
            border: 1px solid #dce3ed;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2785e8;
            box-shadow: 0 0 0 3px rgba(39, 133, 232, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2785e8;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin: 5px 0 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #66758a;
        }

        .options a,
        .signup a {
            color: #2785e8;
            text-decoration: none;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background: #2785e8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #126bc7;
            transform: translateY(-2px);
        }

        .error {
            color: #e04444;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        .signup {
            text-align: center;
            color: #8492a6;
            font-size: 14px;
            margin-top: 28px;
        }

        /* DARK MODE */

        body.dark {
            background: #101827;
        }

        body.dark .container {
            background: #1c293b;
        }

        body.dark .right-section {
            background: #1c293b;
        }

        body.dark .heading h2,
        body.dark .input-group label {
            color: #f1f5fb;
        }

        body.dark .heading p,
        body.dark .signup,
        body.dark .remember {
            color: #aab8ca;
        }

        body.dark .input-group input {
            background: #26364b;
            border-color: #40516a;
            color: white;
        }

        body.dark .theme-btn {
            background: #34465e;
            color: white;
        }

        /* RESPONSIVE */

        @media(max-width: 750px) {
            .container {
                max-width: 470px;
                min-height: auto;
            }

            .left-section {
                display: none;
            }

            .right-section {
                width: 100%;
                padding: 75px 30px 45px;
            }
        }

        @media(max-width: 400px) {
            body {
                padding: 12px;
            }

            .right-section {
                padding: 75px 20px 35px;
            }

            .heading h2 {
                font-size: 26px;
            }

            .options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left-section">

            <div class="logo">
                Aryan's <span>Travel.</span>
            </div>

            <div class="travel-text">
                <h1>Explore the World.<br>Live Your Journey.</h1>

                <p>
                    Your next adventure is just one step away.
                    Sign in and start planning unforgettable
                    travel experiences.
                </p>
            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="right-section">

            <button class="theme-btn" id="themeBtn" type="button" title="Toggle Dark Mode">🌙</button>

            <div class="heading">
                <h2>Welcome Back!</h2>
                <p>Sign in to continue your travel journey.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="toggle-password" id="togglePassword">
                            Show
                        </button>
                    </div>
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <p class="error" id="errorMessage"></p>

            </form>

            <div class="signup">
                Don't have an account?
                <a href="index.html">Sign Up</a>
            </div>

        </div>

    </div>

    <script>

        // SHOW / HIDE PASSWORD

        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {
                password.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                password.type = "password";
                togglePassword.textContent = "Show";
            }

        });


        // DARK MODE

        const themeBtn = document.getElementById("themeBtn");

        function applyTheme() {

            const isDark = localStorage.getItem("theme") === "dark";

            document.body.classList.toggle("dark", isDark);
            themeBtn.textContent = isDark ? "☀️" : "🌙";

        }

        themeBtn.addEventListener("click", function () {

            const isDark = document.body.classList.toggle("dark");

            localStorage.setItem("theme", isDark ? "dark" : "light");

            themeBtn.textContent = isDark ? "☀️" : "🌙";

        });

        applyTheme();


        // LOGIN FORM

        // FRONTEND LOGIN

        document.getElementById("loginForm").addEventListener("submit", function (e) {

            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const passwordValue = password.value;
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.textContent = "";

            if (!email || !passwordValue) {
                errorMessage.textContent = "Please fill in all fields.";
                return;
            }

            // Open Dashboard
            window.location.href = "dashboard.html";

        });

    </script>

</body>

</html>
